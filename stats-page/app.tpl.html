<title>Статистика групп</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Unbounded:wght@600&display=swap">
<style>
:root {
  /* Layout: one working column (max 1200px): toolbar → group tabs → summary tiles → detail blocks; gutter 16px → 28px */
  --paper: #F2F4F7; --surface: #FFFFFF; --sunk: #F7F8FA; --ink: #15171C; --ink-2: #4A5060; --ink-3: #646B7B; --rule: #DDE1E7;
  --pen: #2340C8; --pen-ink: #FFFFFF; --pen-wash: #E7EBFA;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #4a3aa7; --s8: #e34948;
  --deemph: #B4BAC4; --track: #ECEEF2; --grid: #E6E8EC;
  --good: #0ca30c; --warn: #fab219; --crit: #d03b3b;
  --ok-bg: #DFF3DF; --ok-ink: #135C13; --wa-bg: #FDF1D3; --wa-ink: #6A4700; --cr-bg: #FBE2E0; --cr-ink: #8E1C1C;
  --shadow: 0 1px 2px rgba(20, 24, 33, .05), 0 8px 24px rgba(20, 24, 33, .07);
  --f-body: "Golos Text", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-display: "Unbounded", "Golos Text", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0D0F13; --surface: #161920; --sunk: #12151A; --ink: #ECEEF2; --ink-2: #B3B9C5; --ink-3: #8C93A1; --rule: #272B33;
    --pen: #8FA4FF; --pen-ink: #0D0F13; --pen-wash: #1B2240;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
    --deemph: #454B55; --track: #22262D; --grid: #23272E;
    --ok-bg: #0E2E14; --ok-ink: #8FE09A; --wa-bg: #372A07; --wa-ink: #FFD584; --cr-bg: #3E1414; --cr-ink: #FFA7A1;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 10px 28px rgba(0, 0, 0, .35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0D0F13; --surface: #161920; --sunk: #12151A; --ink: #ECEEF2; --ink-2: #B3B9C5; --ink-3: #8C93A1; --rule: #272B33;
  --pen: #8FA4FF; --pen-ink: #0D0F13; --pen-wash: #1B2240;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
  --deemph: #454B55; --track: #22262D; --grid: #23272E;
  --ok-bg: #0E2E14; --ok-ink: #8FE09A; --wa-bg: #372A07; --wa-ink: #FFD584; --cr-bg: #3E1414; --cr-ink: #FFA7A1;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 10px 28px rgba(0, 0, 0, .35);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.5 var(--f-body); }
button, input, select { font: inherit; color: inherit; }
a { color: var(--pen); text-underline-offset: 3px; }
:focus-visible { outline: 2px solid var(--pen); outline-offset: 2px; }
.sr { position: absolute; left: 0; top: 0; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.wrap { max-width: 1200px; margin: 0 auto; padding-inline: 16px; padding-block: 18px 72px; display: grid; gap: 18px; }
@media (min-width: 760px) { .wrap { padding-inline: 28px; padding-block: 26px 96px; gap: 22px; } }
h1 { font: 600 clamp(20px, 3vw, 26px)/1.2 var(--f-display); letter-spacing: -0.01em; margin: 0; }
h2 { font: 650 18px/1.3 var(--f-body); margin: 0; text-wrap: balance; }
h3 { font: 600 15px/1.35 var(--f-body); margin: 0; }
p { margin: 0; }
.muted { color: var(--ink-3); }
.small { font-size: 13px; }
.num { font-variant-numeric: tabular-nums; }

.top { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; }
.top .grow { flex: 1; min-width: 200px; display: grid; gap: 2px; }
.btn { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--rule); background: var(--surface); border-radius: 10px; padding: 8px 14px; font-weight: 600; font-size: 14px; cursor: pointer; }
.btn:hover { border-color: var(--pen); }
.btn.primary { background: var(--pen); color: var(--pen-ink); border-color: var(--pen); }
.btn.quiet { background: transparent; }
.btn.danger { color: var(--cr-ink); }
.btn svg { width: 16px; height: 16px; }
.btn:disabled { opacity: .5; cursor: default; }

.banner { border: 1px solid var(--rule); background: var(--surface); border-radius: 12px; padding: 10px 14px; font-size: 14px; color: var(--ink-2); }
.banner.warn { background: var(--wa-bg); color: var(--wa-ink); border-color: transparent; }

.drop { border: 2px dashed var(--rule); border-radius: 16px; background: var(--surface); padding: 22px; display: grid; gap: 10px; justify-items: start; }
.drop.big { padding: 36px 24px; justify-items: center; text-align: center; }
.drop.over { border-color: var(--pen); background: var(--pen-wash); }
.drop ol { margin: 0; padding-left: 1.2em; color: var(--ink-2); font-size: 14px; display: grid; gap: 4px; text-align: left; }

.tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: thin; }
.tab { position: relative; flex: none; border: 1px solid var(--rule); background: var(--surface); border-radius: 999px; padding: 7px 14px; font-weight: 600; font-size: 14px; cursor: pointer; display: inline-flex; gap: 8px; align-items: center; }
.tab[aria-current="page"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.tab .count { font-weight: 700; font-size: 12px; padding: 0 7px; border-radius: 999px; background: var(--cr-bg); color: var(--cr-ink); }

.card { background: var(--surface); border: 1px solid var(--rule); border-radius: 14px; min-width: 0; }
.card > .hd { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; padding: 14px 16px 0; }
.card > .hd .sp { flex: 1; }
.card > .bd { padding: 12px 16px 16px; min-width: 0; }
.grid2 { display: grid; gap: 18px; min-width: 0; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 960px) { .grid2 { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }
.grid3 { display: grid; gap: 18px; min-width: 0; }
@media (min-width: 960px) { .grid3 { grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr) minmax(0, .9fr); } }

.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0; background: var(--surface); border: 1px solid var(--rule); border-radius: 14px; overflow: hidden; }
@media (min-width: 700px) { .tiles { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (min-width: 1080px) { .tiles { grid-template-columns: repeat(6, minmax(0, 1fr)); } }
.tile { padding: 14px 16px; border-right: 1px solid var(--rule); border-bottom: 1px solid var(--rule); display: grid; gap: 2px; align-content: start; min-width: 0; margin: 0 -1px -1px 0; }
.tile .lbl { font-size: 13px; color: var(--ink-3); }
.tile .val { font-size: 28px; font-weight: 650; line-height: 1.15; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.tile .sub { font-size: 12.5px; color: var(--ink-3); }
.delta { font-size: 12.5px; font-weight: 600; white-space: nowrap; }
.delta.up { color: var(--ok-ink); } .delta.down { color: var(--cr-ink); } .delta.flat { color: var(--ink-3); }

.pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px 2px 8px; border-radius: 999px; font-weight: 650; font-size: 12px; white-space: nowrap; }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.pill.risk { background: var(--cr-bg); color: var(--cr-ink); } .pill.attention { background: var(--wa-bg); color: var(--wa-ink); } .pill.ok { background: var(--ok-bg); color: var(--ok-ink); }

.groups { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 290px), 1fr)); }
.gcard { text-align: left; cursor: pointer; padding: 16px; display: grid; gap: 12px; border: 1px solid var(--rule); background: var(--surface); border-radius: 14px; }
.gcard:hover { border-color: var(--pen); }
.gcard .row { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.gcard .kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.gcard .kpis div { display: grid; gap: 0; }
.gcard .kpis b { font-size: 20px; font-weight: 650; }
.gcard .kpis span { font-size: 12px; color: var(--ink-3); }
.gcard .sparks { display: flex; flex-wrap: wrap; gap: 4px 14px; }
.gcard .sparks span { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }

.list { list-style: none; margin: 0; padding: 0; }
.list li { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--rule); }
.list li:first-child { border-top: 0; }
.list .who { display: grid; gap: 1px; min-width: 0; }
.list .who b { font-weight: 600; }
.list .why { font-size: 13px; color: var(--ink-2); overflow-wrap: anywhere; }
@media (max-width: 520px) { .list li { grid-template-columns: auto minmax(0, 1fr); } .list li > :nth-child(3) { grid-column: 2; } }
.linkbtn { border: 0; background: none; padding: 0; color: var(--ink); font-weight: 600; cursor: pointer; text-align: left; text-decoration: underline; text-decoration-color: var(--rule); text-underline-offset: 3px; }
.linkbtn:hover { color: var(--pen); text-decoration-color: currentColor; }

.scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table.tbl { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 14px; }
.tbl th, .tbl td { padding: 8px 10px; border-bottom: 1px solid var(--rule); text-align: left; white-space: nowrap; background: var(--surface); }
.tbl th { font-size: 12px; font-weight: 600; color: var(--ink-3); position: sticky; top: 0; }
.tbl td.r, .tbl th.r { text-align: right; }
.tbl tr > :first-child { position: sticky; left: 0; z-index: 1; }
.tbl.students { min-width: 980px; }
.tbl.students { --c1: 112px; }
.tbl.students tr > :nth-child(2) { position: sticky; left: var(--c1); z-index: 1; box-shadow: 1px 0 0 var(--rule); }
.tbl.students tr > :first-child { width: var(--c1); min-width: var(--c1); max-width: var(--c1); }
.tbl td.bad { background: var(--cr-bg); color: var(--cr-ink); } .tbl td.meh { background: var(--wa-bg); color: var(--wa-ink); }
.strip { display: flex; gap: 2px; align-items: center; }
.strip i { width: 9px; height: 14px; border-radius: 2px; background: var(--track); display: block; }
.strip i.p { background: var(--good); } .strip i.a { background: var(--crit); } .strip i.y { background: var(--warn); }
.dots { letter-spacing: 1px; font-size: 12px; color: var(--ink-2); }
.cmp td { min-width: 120px; }
.cmp .cell { display: grid; gap: 4px; }
.mini { height: 6px; border-radius: 0 3px 3px 0; background: var(--track); overflow: hidden; }
.mini i { display: block; height: 100%; background: var(--s1); border-radius: 0 3px 3px 0; }

.bars { list-style: none; margin: 0; padding: 0; display: grid; gap: 9px; }
.bars li { display: grid; grid-template-columns: minmax(0, 1fr) 4.6em; gap: 3px 10px; align-items: center; }
.bars .t { grid-column: 1 / -1; font-size: 13px; color: var(--ink-2); display: flex; flex-wrap: wrap; gap: 0 8px; min-width: 0; }
.bars .t span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; flex: 1 1 60%; }
.bars .track { height: 10px; background: var(--track); border-radius: 0 4px 4px 0; overflow: hidden; }
.bars .fill { display: block; height: 100%; border-radius: 0 4px 4px 0; background: var(--s1); }
.bars .fill.de { background: var(--deemph); } .bars .fill.bad { background: var(--crit); } .bars .fill.mid { background: var(--warn); } .bars .fill.good { background: var(--good); }
.bars .v { font-size: 13px; text-align: right; font-variant-numeric: tabular-nums; }

.chart { position: relative; }
.chart svg { display: block; width: 100%; overflow: visible; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--ink-2); margin-bottom: 6px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 14px; height: 3px; border-radius: 2px; display: inline-block; }
.tip { position: absolute; z-index: 5; pointer-events: none; background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; box-shadow: var(--shadow); padding: 8px 10px; font-size: 13px; min-width: 140px; }
.tip .tt { color: var(--ink-3); font-size: 12px; margin-bottom: 4px; }
.tip .r { display: flex; align-items: center; gap: 8px; justify-content: space-between; }
.tip .r i { width: 12px; height: 3px; border-radius: 2px; display: inline-block; margin-right: 6px; }
.tip b { font-variant-numeric: tabular-nums; }
.empty { color: var(--ink-3); font-size: 14px; padding: 6px 0; }
.changes { display: grid; gap: 6px; font-size: 14px; }
.changes li { color: var(--ink-2); }
.warnlist { margin: 0; padding-left: 1.1em; color: var(--ink-2); font-size: 14px; display: grid; gap: 4px; }

dialog { border: 1px solid var(--rule); border-radius: 16px; padding: 0; background: var(--surface); color: var(--ink); width: min(820px, calc(100vw - 24px)); max-height: calc(100vh - 32px); box-shadow: var(--shadow); }
dialog::backdrop { background: rgba(10, 12, 16, .45); }
.dlg { display: grid; gap: 14px; padding: 18px; }
.dlg-hd { display: flex; align-items: flex-start; gap: 12px; }
.dlg-hd .sp { flex: 1; min-width: 0; display: grid; gap: 4px; }
.x { border: 0; background: none; font-size: 22px; line-height: 1; padding: 4px 8px; cursor: pointer; color: var(--ink-3); }
.kv { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
.kv div { background: var(--sunk); border-radius: 10px; padding: 8px 10px; display: grid; gap: 1px; }
.kv span { font-size: 12px; color: var(--ink-3); }
.kv b { font-size: 16px; }
.timeline { display: flex; flex-wrap: wrap; gap: 5px; }
.timeline div { border-radius: 8px; padding: 4px 7px; font-size: 12px; background: var(--sunk); display: grid; min-width: 52px; }
.timeline .p { background: var(--ok-bg); color: var(--ok-ink); } .timeline .a { background: var(--cr-bg); color: var(--cr-ink); } .timeline .y { background: var(--wa-bg); color: var(--wa-ink); }
.timeline small { opacity: .75; }
.msg { white-space: pre-wrap; background: var(--sunk); border-radius: 10px; padding: 12px; font-size: 14px; line-height: 1.55; margin: 0; }
.tasks td { white-space: normal; }
.tasks td.st { white-space: nowrap; }
.field { display: grid; gap: 4px; font-size: 14px; }
.field input, .field select { border: 1px solid var(--rule); background: var(--surface); border-radius: 8px; padding: 7px 10px; min-width: 0; width: 100%; max-width: 100%; }
.uprow { border: 1px solid var(--rule); border-radius: 12px; padding: 12px; display: grid; gap: 10px; }
.uprow .meta { font-size: 13px; color: var(--ink-3); }
.uprow .err { color: var(--cr-ink); font-size: 14px; }
#upNote.err { color: var(--cr-ink); }
.flex { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 9px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 6px 12px; cursor: pointer; font-size: 13px; font-weight: 600; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
[hidden] { display: none !important; }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 10px 16px; border-radius: 10px; font-size: 14px; z-index: 50; box-shadow: var(--shadow); max-width: calc(100vw - 32px); }
@media (prefers-reduced-motion: no-preference) { .card, .gcard { transition: border-color .15s; } }
</style>

<div class="wrap">
  <header class="top">
    <div class="grow">
      <h1>Статистика групп</h1>
      <p class="muted small" id="lastUpdate">Загрузи таблицы групп, и здесь появится сводка.</p>
    </div>
    <button type="button" class="btn primary" id="btnUpload"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 11V2.5M4.5 6 8 2.5 11.5 6M2.5 13.5h11" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>Загрузить таблицы</button>
    <button type="button" class="btn quiet" id="btnSettings">Настройки</button>
    <input type="file" id="fileInput" accept=".xlsx,.xls,.ods,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel,application/vnd.oasis.opendocument.spreadsheet" multiple hidden>
  </header>
  <div id="banner" hidden></div>
  <div id="dropzone"></div>
  <nav class="tabs" id="tabs" aria-label="Группы" hidden></nav>
  <main id="view"></main>
</div>
<div id="live" class="sr" role="status" aria-live="polite"></div>

<dialog id="dlgUpload" aria-labelledby="upTitle"><form method="dialog" class="dlg" id="upForm" novalidate>
  <div class="dlg-hd"><div class="sp"><h2 id="upTitle">Новые таблицы</h2><p class="muted small">Проверь, к какой группе относится каждый файл, и сохрани.</p></div><button type="button" class="x" data-close aria-label="Закрыть">×</button></div>
  <div id="upList" class="grid2" style="grid-template-columns:minmax(0,1fr)"></div>
  <div class="flex"><button type="submit" class="btn primary" id="upSave">Сохранить</button><button type="button" class="btn quiet" data-close>Отмена</button><span class="muted small" id="upNote"></span></div>
</form></dialog>

<dialog id="dlgStudent" aria-labelledby="stTitle"><div class="dlg" id="stBody"></div></dialog>

<dialog id="dlgSettings" aria-labelledby="setTitle"><form method="dialog" class="dlg" id="setForm" novalidate>
  <div class="dlg-hd"><div class="sp"><h2 id="setTitle">Настройки</h2><p class="muted small">Пороги статусов и шкала пробника. Меняются сразу для всех групп.</p></div><button type="button" class="x" data-close aria-label="Закрыть">×</button></div>
  <div class="grid2">
    <label class="field">Шкала входного пробника<select id="setScale"><option value="oge">ОГЭ (3/4/5 от 8/15/22 из 31)</option><option value="base">База ЕГЭ (3/4/5 от 7/12/17 из 21)</option></select></label>
    <label class="field">«Риск», если посещаемость ниже, %<input id="setRisk" type="number" min="0" max="100" step="1"></label>
    <label class="field">«Внимание», если посещаемость ниже, %<input id="setWarn" type="number" min="0" max="100" step="1"></label>
    <label class="field">«Внимание», если сдано ДЗ меньше, %<input id="setHw" type="number" min="0" max="100" step="1"></label>
  </div>
  <div class="card"><div class="hd"><h3>Группы</h3></div><div class="bd" id="setGroups"></div></div>
  <div class="card" id="setBackup" hidden><div class="hd"><h3>Резервная копия</h3></div><div class="bd" style="display:grid;gap:10px">
    <p class="muted small" id="backupNote"></p>
    <div class="flex"><button type="button" class="btn" id="btnExport">Скачать копию</button><button type="button" class="btn quiet" id="btnImport">Загрузить копию</button><input type="file" id="importInput" accept=".json,application/json" hidden></div>
  </div></div>
  <div class="flex"><button type="submit" class="btn primary" id="setSave">Сохранить</button><button type="button" class="btn quiet" data-close>Отмена</button></div>
</form></dialog>

<script>
'use strict';
const P = window.TutorParser;
const $ = id => document.getElementById(id);
const pct = v => v == null ? '—' : Math.round(v * 100) + '%';
const pad = n => String(n).padStart(2, '0');
const todayISO = () => { const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
const ruDate = iso => iso ? iso.slice(8, 10) + '.' + iso.slice(5, 7) + '.' + iso.slice(0, 4) : '';
const localISO = ts => { const d = new Date(ts); return isNaN(d) ? '' : d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
const loadedOn = g => g.snapDate || (g.updatedAt ? localISO(g.updatedAt) : '');
const plural = P.plural;
const STATUS = { risk: 'риск', attention: 'внимание', ok: 'норм' };
const SEV = { risk: 0, attention: 1, ok: 2 };
const SERIES = ['--s1', '--s2', '--s3', '--s4', '--s5', '--s6', '--s7', '--s8'];

function h(tag, props, ...kids) {
  const e = document.createElement(tag);
  if (props) for (const [k, v] of Object.entries(props)) {

let savingSettings = false;
async function saveSettings() {
  if (savingSettings) return;
  const S = state.settings;
  const clamp = (v, d) => { if (String(v).trim() === '') return d; const n = Number(v); return isFinite(n) ? Math.round(Math.max(0, Math.min(100, n))) / 100 : d; };
  const next = { scale: $('setScale').value, riskAtt: clamp($('setRisk').value, S.riskAtt), warnAtt: clamp($('setWarn').value, S.warnAtt), warnHw: clamp($('setHw').value, S.warnHw), streak: S.streak || 2 };
  if (next.warnAtt < next.riskAtt) next.warnAtt = next.riskAtt;
  const changedS = JSON.stringify(next) !== JSON.stringify({ scale: S.scale, riskAtt: S.riskAtt, warnAtt: S.warnAtt, warnHw: S.warnHw, streak: S.streak || 2 });
  savingSettings = true; $('setSave').disabled = true;
  let ok = true;
  if (changedS) { if (db) ok = await dbWrite(() => db.doc('meta/settings').set(next)); if (ok) state.settings = Object.assign({}, P.DEFAULTS, next); }
  for (const g of state.groups) {
    const el = $('gname-' + g.id); if (!el || !ok) continue; const nm = el.value.trim();
    if (nm && nm !== g.name) { if (db) ok = await dbWrite(() => db.collection('groups').doc(g.id).update({ name: nm })); if (ok) g.name = nm; }
  }
  savingSettings = false; $('setSave').disabled = false;
  if (!db) persistLocal();
  metricsCache.clear(); render();
  if (ok) { $('dlgSettings').close(); toast('Сохранено'); }
}
async function deleteGroup(g) {
  const snaps = snapsOf(g.id);
  if (db) {
    if (!await dbWrite(() => db.collection('groups').doc(g.id).delete())) return;
    for (const x of snaps) await dbWrite(() => db.collection('snaps').doc(x.id).delete());
  }
  state.groups = state.groups.filter(x => x.id !== g.id); state.snaps = state.snaps.filter(x => x.group !== g.id);
  if (!db) persistLocal();
  if (state.view === g.id) state.view = 'all';
  $('dlgSettings').close(); render(); toast('Группа удалена');
}
